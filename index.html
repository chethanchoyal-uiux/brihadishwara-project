<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/brand-logo.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Welcome to the Brihadishwara Temple in Thanjavur, a living monument of the Chola dynasty."
    />
    <title>Brihadishwara Temple | Thanjavur</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('brihadishwara_theme')
          if (t === 'light' || t === 'dark') {
            document.documentElement.dataset.theme = t
          } else {
            document.documentElement.dataset.theme = 'light'
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
